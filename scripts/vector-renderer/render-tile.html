<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; }
    #map { width: 512px; height: 512px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const z = parseInt(params.get('z') || '12');
    const x = parseInt(params.get('x') || '4050');
    const y = parseInt(params.get('y') || '2540');
    const styleUrl = params.get('style') || 'http://localhost:9999/style.json';

    // Convert tile coordinates to center lat/lon
    function tileCenterToLatLon(z, x, y) {
      const n = Math.pow(2, z);
      const lon = ((x + 0.5) / n) * 360 - 180;
      const latRad = Math.atan(Math.sinh(Math.PI * (1 - 2 * (y + 0.5) / n)));
      const lat = latRad * 180 / Math.PI;
      return [lon, lat];
    }

    const [lon, lat] = tileCenterToLatLon(z, x, y);

    // MapLibre uses 512px as its native tile size.
    // Rendering in a 512px container at zoom=z gives exactly the right
    // detail level and geographic extent for one tile.
    const map = new maplibregl.Map({
      container: 'map',
      style: styleUrl,
      center: [lon, lat],
      zoom: z,
      fadeDuration: 0,
      preserveDrawingBuffer: true,
      antialias: true,
      pixelRatio: 1,
      interactive: false,
      attributionControl: false,
      renderWorldCopies: false,
    });

    map.on('idle', () => {
      window._tileRendered = true;
    });

    map.on('error', (e) => {
      console.error('Map error:', e.error);
      window._tileError = e.error?.message || 'Unknown error';
    });
  </script>
</body>
</html>
