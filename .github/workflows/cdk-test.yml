name: Test CDK code

# This workflow is triggered on pushes and pull requests to the main branch.
# It can also be triggered manually.
# It runs tests on the CDK code to ensure that it is functioning correctly.
# The workflow will not run for draft pull requests.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - run: echo "🌅 Job triggered by ${{ github.event_name }} event"
      - run: echo "💨 Job running on ${{ runner.os }}"
      - run: echo "🕊️ Branch is ${{ github.ref }}"
      - run: echo "👾 Repository is ${{ github.repository }}."
      
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Install system dependencies
        # Required for container builds and testing.
        #
        # The hosted runner image ships pre-configured third-party apt repos
        # (e.g. Google Chrome, Microsoft) that intermittently serve a
        # mismatched Packages.gz hash. That makes a plain `apt-get update` exit
        # 100 and fail the whole job for reasons unrelated to this project — we
        # only need `curl` from the Ubuntu archive. Drop those third-party
        # source lists before updating so an upstream hash flake there can't
        # break our build.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
            node-version: '24'
            registry-url: https://registry.npmjs.org/
            cache: 'npm'

      - name: Install CDK package dependencies
        run: npm ci  # Use npm ci for faster, reliable installs

      - name: TypeScript compilation check
        run: npx tsc --noEmit --skipLibCheck

      - name: CDK Synthesis Check
        run: |
          # Validate CDK can synthesize without errors
          npm run cdk synth -- --context envType=dev-test
          npm run cdk synth -- --context envType=prod

      - name: Run tests with coverage report
        run: npm run test:coverage