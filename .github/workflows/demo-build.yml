name: Build and Push Docker Images - Demo

on:
  push:
    branches: [main]
    paths:
      - 'weather-proxy/**'
      - 'ais-proxy/**'
      - 'power-outages/**'
      - 'tileserver-gl/**'
      - 'terrain-proxy/**'
      - 'sar-engine/**'
      - '**/Dockerfile'
      - 'cdk.json'
  workflow_call:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if version unchanged'
        required: false
        default: false
        type: boolean
    outputs:
      image-tags-json:
        description: 'All container image tags as JSON'
        value: ${{ jobs.build-images.outputs.image-tags-json }}
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if version unchanged'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    environment: demo
    outputs:
      image-tags-json: ${{ steps.build.outputs.image-tags-json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Setup CDK Environment
        uses: ./.github/actions/setup-cdk
        with:
          aws-role-arn: ${{ secrets.DEMO_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.DEMO_AWS_REGION }}
          role-session-name: GitHubActions-DockerBuild
      
      - name: Get ECR Repository
        id: ecr
        run: |
          # Get ECR repository ARN from BaseInfra exports
          ECR_REPO_ARN=$(aws cloudformation describe-stacks \
            --stack-name TAK-${{ vars.DEMO_STACK_NAME }}-BaseInfra \
            --query 'Stacks[0].Outputs[?OutputKey==`EcrArtifactsRepoArnOutput`].OutputValue' \
            --output text)
          
          if [[ -z "$ECR_REPO_ARN" ]]; then
            echo "ERROR: ECR repository ARN not found in BaseInfra stack outputs"
            exit 1
          fi
          
          # Extract repository name from ARN and build URI
          ECR_REPO_NAME=$(echo $ECR_REPO_ARN | cut -d'/' -f2)
          ECR_REPO_URI="${{ secrets.DEMO_AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.DEMO_AWS_REGION }}.amazonaws.com/${ECR_REPO_NAME}"
          
          echo "ecr-repo-uri=$ECR_REPO_URI" >> $GITHUB_OUTPUT
          echo "ecr-repo-name=$ECR_REPO_NAME" >> $GITHUB_OUTPUT
          echo "Using ECR repository: $ECR_REPO_URI"
      
      - name: Discover Enabled Containers
        id: containers
        run: |
          # Get all enabled containers dynamically
          CONTAINERS=$(jq -r '.context["dev-test"].containers | to_entries[] | select(.value.enabled == true) | .key' cdk.json)
          echo "enabled-containers<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTAINERS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Enabled containers:"
          echo "$CONTAINERS"
      
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.DEMO_AWS_REGION }} | \
            docker login --username AWS --password-stdin \
            ${{ steps.ecr.outputs.ecr-repo-uri }}
      
      - name: Build and Push Container Images
        id: build
        run: |
          ECR_REPO_NAME="${{ steps.ecr.outputs.ecr-repo-name }}"
          ECR_REPO_URI="${{ steps.ecr.outputs.ecr-repo-uri }}"
          
          # Initialize JSON object for image tags
          IMAGE_TAGS_JSON="{}"
          
          # Build each enabled container
          while IFS= read -r container; do
            if [[ -z "$container" ]]; then continue; fi
            
            # Get version from cdk.json
            VERSION=$(jq -r ".context[\"dev-test\"].containers[\"$container\"].imageTag" cdk.json)
            
            # Generate tag with utils- prefix
            if [[ "${{ github.event.inputs.force_rebuild }}" == "true" ]]; then
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              TAG="utils-$container-${TIMESTAMP}"
            else
              TAG="utils-$container-${VERSION}"
            fi
            
            # Check if image already exists
            if aws ecr describe-images --repository-name $ECR_REPO_NAME --image-ids imageTag=$TAG >/dev/null 2>&1; then
              echo "✅ $container image already exists, skipping build"
            else
              echo "🔨 Building $container image"
              docker build --platform linux/amd64 -t $ECR_REPO_URI:$TAG ./$container
              docker push $ECR_REPO_URI:$TAG
              echo "✅ $container image pushed"
            fi
            
            # Add to JSON object
            IMAGE_TAGS_JSON=$(echo $IMAGE_TAGS_JSON | jq --arg key "$container" --arg value "$TAG" '. + {($key): $value}')
            
          done <<< "${{ steps.containers.outputs.enabled-containers }}"
          
          # SAR engine: an AWS Lambda container image built from the sar-engine/ folder of this repository, only when it
          # is enabled for this environment. The tag ends in a hash of the files Dockerfile.lambda copies into the image
          # (not of the whole folder, so engine docs and check scripts do not trigger a rebuild), so any change to the
          # engine code gives a new tag instead of reusing a stale image.
          SAR_ENABLED=$(jq -r '.context["dev-test"].sarEngine.enabled // false' cdk.json)
          if [[ "$SAR_ENABLED" == "true" ]]; then
            SAR_VERSION=$(jq -r '.context["dev-test"].sarEngine.imageTag' cdk.json)
            SAR_HASH=$(git ls-tree -r HEAD -- sar-engine/Dockerfile.lambda sar-engine/.dockerignore sar-engine/nz sar-engine/app/pipeline | sha1sum | cut -c1-7)
            if [[ ! "$SAR_VERSION" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || [[ ! "$SAR_HASH" =~ ^[0-9a-f]{7}$ ]]; then
              echo "ERROR: sarEngine.imageTag in cdk.json is not a version label, or the engine files could not be hashed"
              exit 1
            fi
            if [[ "${{ github.event.inputs.force_rebuild }}" == "true" ]]; then
              SAR_TAG="utils-sar-engine-$(date +%Y%m%d-%H%M%S)"
            else
              SAR_TAG="utils-sar-engine-${SAR_VERSION}-${SAR_HASH}"
            fi
            if aws ecr describe-images --repository-name $ECR_REPO_NAME --image-ids imageTag=$SAR_TAG >/dev/null 2>&1; then
              echo "✅ sar-engine image already exists, skipping build"
            else
              echo "🔨 Building sar-engine image ($SAR_TAG)"
              # Lambda does not accept images with attestation manifests, hence the two --provenance/--sbom flags.
              docker build --platform linux/amd64 --provenance=false --sbom=false \
                -f sar-engine/Dockerfile.lambda -t $ECR_REPO_URI:$SAR_TAG ./sar-engine
              docker push $ECR_REPO_URI:$SAR_TAG
              echo "✅ sar-engine image pushed"
            fi
            IMAGE_TAGS_JSON=$(echo $IMAGE_TAGS_JSON | jq --arg value "$SAR_TAG" '. + {"sar-engine": $value}')
          fi
          # Output JSON for deploy workflows (compact format for GitHub Actions)
          COMPACT_JSON=$(echo $IMAGE_TAGS_JSON | jq -c .)
          echo "image-tags-json=$COMPACT_JSON" >> $GITHUB_OUTPUT
          echo "Built image tags: $COMPACT_JSON"
          

      
      - name: Output Image Information
        run: |
          echo "✅ Successfully built and pushed Docker images:"
          echo '${{ steps.build.outputs.image-tags-json }}' | jq -r 'to_entries[] | "📦 \(.key): \(.value)"'
          echo ""
          echo "🚀 To deploy with these images, use:"
          echo "npm run cdk deploy -- --context usePreBuiltImages=true --context imageTagsJson='${{ steps.build.outputs.image-tags-json }}'"